<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sorteo de equipos - Tibia y Peroné F.C.</title>
    
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body style="background-color: #efefef;">
    <div class="container bg-white p-4 my-4 rounded shadow-sm">
        <h1 class="mt-2 mb-4 text-center">Sorteo de equipos - Tibia y Peroné F.C.</h1>
        
        <div class="row">
            <!-- COLUMNA IZQUIERDA: BASE DE DATOS DE JUGADORES (MAESTRO) -->
            <div class="col-md-5 border-end pe-4">
                <h3 class="h5 text-secondary mb-3">1. Registrar Jugador</h3>
                <form id="form-registrar" class="row g-2 mb-3">
                    <div class="col-12">
                        <input type="text" id="nombre-registro" class="form-control" placeholder="Nombre completo..." required autocomplete="off">
                    </div>
                    <div class="col-7">
                        <select id="tipo-registro" class="form-select">
                            <option value="TITULAR">Titular (Permanente)</option>
                            <option value="INVITADO">Invitado (Temporal)</option>
                        </select>
                    </div>
                    <div class="col-5">
                        <button type="submit" class="btn btn-secondary w-100">Registrar</button>
                    </div>
                </form>

                <h6 class="text-muted mt-4">Jugadores Registrados en el Sistema</h6>
                <div class="border rounded p-2 bg-light" style="max-height: 250px; overflow-y: auto;">
                    <div id="lista-maestra">
                        <!-- Se llena dinámicamente con Firestore -->
                    </div>
                </div>
            </div>

            <!-- COLUMNA DERECHA: CONVOCATORIA PARA EL PARTIDO -->
            <div class="col-md-7 ps-4">
                <h3 class="h5 text-primary mb-3">2. Anotar para el Partido de Hoy</h3>
                <form id="form-anotar" class="row g-2 mb-4">
                    <div class="col-8">
                        <input type="text" id="nombre-partido" list="lista-jugadores" class="form-control" placeholder="Escribí o seleccioná..." required autocomplete="off">
                        <datalist id="lista-jugadores">
                            <!-- Opciones dinámicas de los no anotados -->
                        </datalist>
                    </div>
                    <div class="col-4">
                        <button type="submit" class="btn btn-primary w-100">Anotar</button>
                    </div>
                </form>

                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h4 class="h6 mb-0 text-dark fw-bold">Convocados (Prioriza Titulares)</h4>
                    <button id="btn-limpiar-convocados" class="btn btn-outline-danger btn-sm py-0">Limpiar Convocados</button>
                </div>

                <div style="max-height: 250px; overflow-y: auto;" class="border rounded">
                    <table class="table table-striped table-hover mb-0">
                        <thead>
                            <tr>
                                <th scope="col" style="width: 10%">N°</th>
                                <th scope="col">Jugador</th>
                                <th scope="col" style="width: 25%">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-convocados">
                            <!-- Se llena dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <hr class="my-4">

        <!-- CONFIGURACIÓN DEL SORTEO -->
        <div class="card bg-light p-3 mb-4">
            <div class="row align-items-center justify-content-center g-3">
                <div class="col-auto">
                    <label class="fw-bold text-dark">Formato:</label>
                </div>
                <div class="col-auto">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="formato_radio" id="f5" value="5" checked>
                        <label class="form-check-label fw-bold text-success" for="f5">Fútbol 5</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="formato_radio" id="f6" value="6">
                        <label class="form-check-label fw-bold text-info" for="f6">Fútbol 6</label>
                    </div>
                </div>
                <div class="col-auto">
                    <button id="btn-sortear" class="btn btn-success btn-lg px-5 shadow-sm">¡Sortear Equipos!</button>
                </div>
            </div>
        </div>

        <!-- RESULTADOS -->
        <div id="result-container" class="border p-4 bg-light rounded shadow-inner">
            <h2 class="text-center border-bottom pb-2 text-dark">Tabla de Equipos Organizados</h2>
            <div id="team-list" class="row mt-3"></div>
        </div>
    </div>

    <!-- FIREBASE SDKs & LOGICA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        // Credenciales configuradas
        const firebaseConfig = {
            apiKey: "AIzaSyCYEloScxk19RM31Nn6QICmRRod2csZmiY",
            authDomain: "tibia-y-perone.firebaseapp.com",
            projectId: "tibia-y-perone",
            storageBucket: "tibia-y-perone.firebasestorage.app",
            messagingSenderId: "667357551434",
            appId: "1:667357551434:web:fd3db19319c60e9fff7fb3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // FUNCIONES DE CARGA Y ACTUALIZACIÓN DE DATOS
        async function cargarDatos() {
            // 1. Cargar Jugadores Base (Maestro)
            const querySnapshotBase = await getDocs(collection(db, "jugadores_base"));
            let jugadoresBase = [];
            let htmlMaestro = "";
            
            querySnapshotBase.forEach((docSnap) => {
                let data = docSnap.data();
                jugadoresBase.push({ id: docSnap.id, ...data });
            });

            // Ordenar alfabéticamente
            jugadoresBase.sort((a, b) => a.nombre.localeCompare(b.nombre));

            jugadoresBase.forEach(j => {
                let badgeColor = j.tipo === 'TITULAR' ? 'bg-primary' : 'bg-warning text-dark';
                htmlMaestro += `
                    <div class="d-flex justify-content-between align-items-center mb-1 pb-1 border-bottom">
                        <div>
                            <span class="small fw-bold">${j.nombre}</span> 
                            <span class="badge ${badgeColor}" style="font-size:9px;">${j.tipo}</span>
                        </div>
                        <button class="btn text-danger p-0 px-1 small btn-eliminar-base" data-id="${j.id}">✕</button>
                    </div>`;
            });
            document.getElementById("lista-maestra").innerHTML = htmlMaestro;

            // 2. Cargar Convocados de Hoy
            const querySnapshotConvocados = await getDocs(collection(db, "convocados"));
            let convocados = [];
            let htmlConvocados = "";
            let nombresConvocadosSet = new Set();

            querySnapshotConvocados.forEach((docSnap) => {
                let data = docSnap.data();
                convocados.push({ id: docSnap.id, ...data });
                nombresConvocadosSet.add(data.nombre);
            });

            if (convocados.length === 0) {
                htmlConvocados = `<tr><td colspan="3" class="text-center text-muted small">No hay jugadores anotados para hoy.</td></tr>`;
            } else {
                convocados.forEach((c, index) => {
                    let badgeColor = c.tipo === 'TITULAR' ? 'bg-secondary' : 'bg-info text-dark';
                    htmlConvocados += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${c.nombre} <span class="badge ${badgeColor}" style="font-size:10px;">${c.tipo}</span></td>
                            <td>
                                <button class="btn btn-danger btn-sm py-0 btn-eliminar-convocado" data-id="${c.id}">✕</button>
                            </td>
                        </tr>`;
                });
            }
            document.getElementById("tabla-convocados").innerHTML = htmlConvocados;

            // 3. Poblar el Datalist filtrando los ya convocados
            let htmlDatalist = "";
            jugadoresBase.forEach(j => {
                if (!nombresConvocadosSet.has(j.nombre)) {
                    htmlDatalist += `<option value="${j.nombre}">`;
                }
            });
            document.getElementById("lista-jugadores").innerHTML = htmlDatalist;

            // Eventos para eliminar registros cargados dinámicamente
            document.querySelectorAll('.btn-eliminar-base').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    await deleteDoc(doc(db, "jugadores_base", e.target.dataset.id));
                    cargarDatos();
                });
            });

            document.querySelectorAll('.btn-eliminar-convocado').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    await deleteDoc(doc(db, "convocados", e.target.dataset.id));
                    cargarDatos();
                });
            });
        }

        // Registrar Jugador en la Base Maestra
        document.getElementById('form-registrar').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre-registro').value.trim();
            const tipo = document.getElementById('tipo-registro').value;
            if (nombre) {
                await addDoc(collection(db, "jugadores_base"), { nombre, tipo });
                document.getElementById('nombre-registro').value = '';
                cargarDatos();
            }
        });

        // Anotar Convocado para el Partido
        document.getElementById('form-anotar').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombreSeleccionado = document.getElementById('nombre-partido').value.trim();
            if (nombreSeleccionado) {
                const q = query(collection(db, "jugadores_base"), where("nombre", "==", nombreSeleccionado));
                const querySnapshot = await getDocs(q);
                let tipoActual = "INVITADO";
                querySnapshot.forEach((doc) => {
                    tipoActual = doc.data().tipo;
                });

                await addDoc(collection(db, "convocados"), {
                    nombre: nombreSeleccionado,
                    tipo: tipoActual
                });

                document.getElementById('nombre-partido').value = '';
                cargarDatos();
            }
        });

        // Limpiar Lista de Convocados
        document.getElementById('btn-limpiar-convocados').addEventListener('click', async () => {
            const querySnapshot = await getDocs(collection(db, "convocados"));
            const deletes = querySnapshot.docs.map(d => deleteDoc(doc(db, "convocados", d.id)));
            await Promise.all(deletes);
            cargarDatos();
        });

        // Mecánica de Sorteo (Titulares primero, respetando Shuffle)
        document.getElementById('btn-sortear').addEventListener('click', async () => {
            const querySnapshot = await getDocs(collection(db, "convocados"));
            let titulares = [];
            let invitados = [];

            querySnapshot.forEach((doc) => {
                let data = doc.data();
                if (data.tipo === 'TITULAR') titulares.push(data.nombre);
                else invitados.push(data.nombre);
            });

            titulares.sort(() => Math.random() - 0.5);
            invitados.sort(() => Math.random() - 0.5);

            const listaFinal = [...titulares, ...invitados];
            const formato = parseInt(document.querySelector("input[name='formato_radio']:checked").value);

            mostrarEquipos(listaFinal, formato);
        });

        function mostrarEquipos(lista, formato) {
            const container = document.getElementById("team-list");
            container.innerHTML = "";

            if (lista.length === 0) {
                container.innerHTML = '<p class="text-center text-muted">No hay jugadores anotados para sortear.</p>';
                return;
            }

            let grupoNum = 1;
            let currentCard = document.createElement('div');
            currentCard.className = "col-md-4 mb-3";
            currentCard.innerHTML = `<div class="card shadow-sm"><div class="card-header bg-dark text-white fw-bold">Equipo ${grupoNum}</div><div class="card-body"><ol class="mb-0"></ol></div></div>`;
            let currentOl = currentCard.querySelector('ol');

            for (let i = 0; i < lista.length; i++) {
                let li = document.createElement('li');
                li.textContent = lista[i];
                currentOl.appendChild(li);

                if ((i + 1) % formato === 0 && (i + 1) < lista.length) {
                    container.appendChild(currentCard);
                    grupoNum++;
                    currentCard = document.createElement('div');
                    currentCard.className = "col-md-4 mb-3";
                    currentCard.innerHTML = `<div class="card shadow-sm"><div class="card-header bg-dark text-white fw-bold">Equipo ${grupoNum}</div><div class="card-body"><ol class="mb-0"></ol></div></div>`;
                    currentOl = currentCard.querySelector('ol');
                }
            }
            container.appendChild(currentCard);
        }

        // Cargar datos al iniciar
        window.onload = cargarDatos;
    </script>
</body>
</html>
